# Same stack as the hand-made /opt/monitoring, so the existing data volumes are reused.
# The deploy runs it with `-p monitoring`; that project name is what keeps
# monitoring_prometheus-data and monitoring_grafana-data attached.
services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=365d
    volumes:
      # The folder, not the single file: a deploy replaces files, and a single-file
      # bind mount would keep showing the old copy.
      - ./prometheus:/etc/prometheus:ro
      - /etc/monitoring-deploy/secrets:/secrets:ro    # credential files named in prometheus.yml; not in git
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: grafana
    environment:
      # Business Text panel, used by the cards on the Homelab dashboard. Grafana downloads it from
      # grafana.com when the container starts and keeps it in the grafana-data volume.
      - GF_INSTALL_PLUGINS=marcusolsson-dynamictext-panel 6.3.0
    volumes:
      - grafana-data:/var/lib/grafana
      # Only the dashboards provisioning folder, so anything made in the UI is left alone.
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.6
    container_name: uptime-kuma
    environment:
      # Kuma's notification templates print times in the process's time zone (UTC otherwise).
      - TZ=America/New_York
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3002:3001"    # 3001 is Homepage's
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  uptime-kuma-data:
