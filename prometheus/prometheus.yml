global:
  scrape_interval: 15s

scrape_configs:
  - job_name: esp-soil
    static_configs:
      - targets: ['192.168.1.162:80']

  # Machines running prometheus-node-exporter (CPU, memory, disk, network).
  # Add a machine by adding it to targets/nodes.yml; no reload is needed.
  - job_name: node
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/nodes.yml
        refresh_interval: 1m
